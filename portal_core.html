<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Keep the portal locked until the server validates its HttpOnly session.
document.addEventListener('DOMContentLoaded',function(){
  var a=document.getElementById('auth-screen');
  if(a)a.style.display='flex';
});
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WTS Result Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#1a2a4a;--g2:#243560;--g3:#7dd4b0;
  --gold:#7dd4b0;--gold2:#a8e6cc;
  --bg:#f0f7f4;--white:#fff;
  --gray:#4a5568;--border:#c8e6d8;
  --shadow:0 2px 8px rgba(26,42,74,.10);
  --shadow2:0 8px 32px rgba(26,42,74,.20);
  --radius:12px;
}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:#1f2937;min-height:100vh}

/* ── SIDEBAR ── */
#sidebar{position:fixed;top:0;left:0;width:248px;height:100vh;
  background:var(--g1);display:flex;flex-direction:column;z-index:100;
  transition:transform .25s ease;border-right:3px solid var(--g3);padding-bottom:110px;box-sizing:border-box}
.sb-logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sb-logo h1{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold2);line-height:1.3}
.sb-logo p{font-size:.68rem;color:rgba(255,255,255,.4);margin-top:2px}
.sb-class-lbl{display:none;padding:8px 16px;background:rgba(0,0,0,.3);
  border-bottom:1px solid rgba(255,255,255,.07)}
.sb-class-lbl span{font-size:.65rem;color:rgba(255,255,255,.4);text-transform:uppercase;display:block}
.sb-class-lbl strong{font-size:.88rem;color:var(--gold2)}
nav{flex:1;overflow-y:auto;padding:8px 0}
.ni{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;
  color:rgba(255,255,255,.6);font-size:.85rem;font-weight:500;
  border-left:3px solid transparent;transition:.15s;
  -webkit-tap-highlight-color:transparent;user-select:none}
.ni:active,.ni:hover{background:rgba(255,255,255,.06);color:#fff}
.ni.active{background:rgba(201,146,42,.14);color:var(--gold2);border-left-color:var(--gold2)}
.ni svg{width:17px;height:17px;flex-shrink:0;opacity:.75}
.ni.active svg{opacity:1}
.ni-back{color:rgba(255,255,255,.4)!important;font-size:.78rem!important}
.ni-divider{height:1px;background:rgba(255,255,255,.08);margin:6px 0}
.sb-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);
  font-size:.68rem;color:rgba(255,255,255,.3);line-height:1.5}
.sb-session{display:inline-block;background:var(--gold);color:var(--g1);
  font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:4px}

/* ── TOPBAR ── */
#main{margin-left:248px;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--white);border-bottom:1px solid var(--border);
  padding:12px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;gap:10px}
.tb-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.tb-title{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--g1)}
.tb-sub{font-size:.72rem;color:var(--gray);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.class-chip{display:none;align-items:center;gap:4px;background:var(--g1);color:var(--gold2);
  font-size:.72rem;font-weight:700;padding:3px 10px 3px 8px;border-radius:20px;
  cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.class-chip svg{width:12px;height:12px}
#hamburger{display:none;background:none;border:none;cursor:pointer;
  flex-direction:column;gap:5px;padding:4px;-webkit-tap-highlight-color:transparent}
#hamburger span{width:22px;height:2px;background:var(--g1);border-radius:2px;transition:.25s;display:block}
#hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
#hamburger.open span:nth-child(2){opacity:0}
#hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.saved-msg{font-size:.75rem;color:var(--g3);font-weight:600;opacity:0;transition:.3s}
.saved-msg.show{opacity:1}

/* ── CONTENT ── */
.content{flex:1;padding:24px}
.page{display:none}
.page.active{display:block}


/* ── AUTH ── */
#auth-screen{position:fixed;inset:0;background:var(--g1);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
.auth-box{background:#fff;border-radius:16px;width:100%;max-width:400px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.auth-header{background:var(--g1);padding:28px 24px 20px;text-align:center;border-bottom:3px solid var(--g3)}
.auth-header img{width:80px;height:80px;object-fit:contain;margin-bottom:10px;display:block;margin-left:auto;margin-right:auto}
.auth-header h2{color:var(--g3);font-family:'Playfair Display',serif;font-size:1.1rem;margin-bottom:2px}
.auth-header p{color:rgba(255,255,255,.6);font-size:.75rem}
.auth-body{padding:24px}
.auth-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:20px}
.auth-tab{flex:1;padding:10px;text-align:center;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--gray);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.auth-tab.active{color:var(--g1);border-bottom-color:var(--g3)}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:.75rem;font-weight:700;color:var(--gray);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.auth-field input{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:8px;font-size:.9rem;outline:none;box-sizing:border-box;transition:border .2s}
.auth-field input:focus{border-color:var(--g3)}
.auth-btn{width:100%;padding:12px;background:var(--g1);color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:6px;transition:background .2s}
.auth-btn:hover{background:var(--g2)}
.auth-err{background:#fee2e2;color:#dc2626;padding:10px 12px;border-radius:8px;font-size:.8rem;margin-bottom:12px;display:none}
.auth-err.show{display:block}
.auth-footer{text-align:center;padding:0 24px 20px;font-size:.75rem;color:var(--gray)}
/* Role badge in sidebar */
#sb-role-badge{font-size:.62rem;padding:2px 8px;border-radius:10px;font-weight:700;margin-top:3px;display:inline-block}
.badge-access{background:var(--g3);color:var(--g1)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.85rem;
  font-weight:600;cursor:pointer;border:none;transition:.15s;
  -webkit-tap-highlight-color:transparent;user-select:none}
.btn-primary{background:var(--g1);color:#fff}
.btn-primary:active{background:var(--g2)}
.btn-outline{background:transparent;border:2px solid var(--g1);color:var(--g1)}
.btn-outline:active{background:#f0fdf4}
.btn-gold{background:var(--gold);color:var(--g1)}
.btn-danger{background:#dc2626;color:#fff}
.btn-sm{padding:5px 12px;font-size:.78rem}
.btn-xs{padding:3px 8px;font-size:.72rem}

/* ── CARDS & TABLES ── */
.stat-card{background:var(--white);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);border-top:3px solid var(--g3);position:relative;overflow:hidden}
.stat-card.gold{border-top-color:var(--gold)}
.stat-card.blue{border-top-color:#3b82f6}
.stat-card.red{border-top-color:#ef4444}
.stat-card h3{font-size:2rem;font-weight:700;color:var(--g1)}
.stat-card p{font-size:.72rem;font-weight:700;color:var(--gray);text-transform:uppercase;margin-top:2px}
.stat-icon{position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font-size:2.5rem;opacity:.08}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}

.tbl-wrap{background:var(--white);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.tbl-head{padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border)}
.tbl-head h3{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--g1)}
.data-table{width:100%;border-collapse:collapse;font-size:.82rem}
.data-table th{background:var(--g1);color:#fff;padding:10px 12px;text-align:left;
  font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.data-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#fafafa}
.data-table tr[data-clickable]{cursor:pointer}
.data-table tr[data-clickable]:hover td{background:#f0fdf4}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;
  font-size:.7rem;font-weight:700}
.badge-blue{background:#dbeafe;color:#1d4ed8}
.badge-gold{background:#fef3c7;color:#92400e}
.badge-green{background:#d1fae5;color:#065f46}
.badge-red{background:#fee2e2;color:#991b1b}
.badge-sci{background:#e0f2fe;color:#0369a1}
.badge-arts{background:#fce7f3;color:#9d174d}
.badge-bus{background:#fef9c3;color:#713f12}
.rk{display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;font-size:.72rem;font-weight:700}
.rk1{background:#fef3c7;color:#92400e}
.rk2{background:#f3f4f6;color:#374151}
.rk3{background:#fde8d8;color:#c2410c}
.rkn{background:#f9fafb;color:#6b7280}

/* ── FORMS ── */
.inp{width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:.88rem;transition:.15s;background:#fff}
.inp:focus{border-color:var(--g3);outline:none;background:#f0fdf4}
.sel{width:100%;padding:9px 12px;border:2px solid var(--border);border-radius:8px;
  font-family:'DM Sans',sans-serif;font-size:.88rem;background:#fff;cursor:pointer}
.sel:focus{border-color:var(--g3);outline:none}
.fg{margin-bottom:14px}
.fg label{font-size:.78rem;font-weight:700;color:#374151;display:block;m
